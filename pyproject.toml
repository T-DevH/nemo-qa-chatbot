[build-system]
requires = [
  "setuptools>=42",
  "wheel",
  "numpy==1.23.5",
  "Cython>=0.29.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "nemo_qa"
version = "0.1.0"
description = "Q&A chatbot built with NVIDIA NeMo 2.0 and LLAMA3"
readme = "README.md"
authors = [{name = "T-DevH", email = "thammadou@gmail.com"}]
license = "Apache-2.0"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Operating System :: OS Independent"
]
requires-python = ">=3.10,<3.11"
dependencies = [
  # Core ML dependencies (must be first)
  "torch>=2.7.0",
  "torchaudio>=2.7.0",
  "nemo-toolkit[all]>=2.0.0",
  
  # App-specific LLM dependencies
  "transformers>=4.44.0,<5.0.0",
  "sentencepiece>=0.1.99",
  "einops>=0.6.1",

  # Web and API
  "fastapi>=0.95.0,<0.100.0",
  "pydantic>=1.10.0,<2.0.0",
  "uvicorn==0.22.0",
  "gradio==3.32.0",

  # Data & Visualization
  "pandas==2.0.0",
  "scikit-learn==1.2.0",
  "matplotlib==3.7.0",
  "tensorboard==2.11.0",
  "wget==3.2",
  "tqdm==4.65.0",

  # Model I/O and Hub
  "huggingface_hub>=0.16.0",

  # Optional NeMo components (safe)
  "hydra-core==1.3.2",
  "omegaconf==2.3.0"
]

[project.optional-dependencies]
dev = [
  "black>=22.3.0",
  "isort>=5.10.1",
  "flake8>=4.0.1",
  "pytest>=7.1.1"
]
mamba = [
  "mamba-ssm>=2.2.2"
]

[project.urls]
"Homepage" = "https://github.com/T-DevH/nemo-qa-chatbot"
"Bug Tracker" = "https://github.com/T-DevH/nemo-qa-chatbot/issues"

[project.scripts]
nemo-qa-download-model = "nemo_qa.scripts.download_model:main"
nemo-qa-curate-data = "nemo_qa.scripts.curate_data:main"
nemo-qa-train = "nemo_qa.scripts.train:main"
nemo-qa-evaluate = "nemo_qa.scripts.evaluate:main"
nemo-qa-export-nim = "nemo_qa.scripts.export_nim:main"
nemo-qa-deploy = "nemo_qa.scripts.deploy:main"

[tool.setuptools.packages.find]
include = ["nemo_qa*", "nim*"]
exclude = ["data*", "notebooks*", "tests*"]

[tool.black]
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
  \.git
 | \.hg
 | \.mypy_cache
 | \.tox
 | \.venv
 | _build
 | buck-out
 | build
 | dist
)/
'''

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
